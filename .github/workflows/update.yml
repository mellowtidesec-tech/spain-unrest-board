name: update-board
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Fetch every source this run (costs more)"
        default: "0"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: board
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, score, render
        env:
          TREG_TOKEN: ${{ secrets.TREG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_ALL: ${{ github.event.inputs.force_all || '0' }}
        run: python scripts/update.py
      - name: Commit data
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "update $(date -u +%FT%TZ)"
          git pull --rebase -X ours || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
